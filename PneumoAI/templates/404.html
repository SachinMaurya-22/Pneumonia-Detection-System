
{% extends "base.html" %}

{% block title %}404 - Page Not Found | PneumoAI{% endblock %}

{% block extra_css %}
<style>
    .error-section {
        min-height: 65vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        text-align: center;
    }

    .error-code {
        font-size: clamp(6rem, 20vw, 10rem);
        font-weight: 800;
        line-height: 1;
        color: #0f766e;
        letter-spacing: -5px;
    }

    .error-icon {
        font-size: 55px;
        color: #94a3b8;
    }
</style>
{% endblock %}

{% block content %}

<section class="error-section">
    <div>
        <i class="bi bi-search error-icon"></i>

        <h1 class="error-code mt-3">404</h1>

        <h2 class="fw-bold mt-3">Page Not Found</h2>

        <p class="text-secondary mx-auto mt-3"
           style="max-width: 480px;">
            Sorry, the page you are looking for does not exist,
            may have moved, or the URL may be incorrect.
        </p>

        <a href="{{ url_for('index') }}"
           class="btn btn-success mt-3">
            <i class="bi bi-house-door me-2"></i>
            Return to Home
        </a>
    </div>
</section>

{% endblock %}
